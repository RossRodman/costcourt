repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  # Backend
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Client (uses the project's own Prettier/oxlint from client/node_modules)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: client/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^client/
        exclude: ^client/package-lock\.json$
      - id: oxlint
        name: oxlint
        entry: client/node_modules/.bin/oxlint -c client/.oxlintrc.json --deny-warnings
        language: system
        files: ^client/src/.*\.(ts|tsx)$
